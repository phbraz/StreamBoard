# Copy to ~/.config/soundboard/config.toml. Every key is optional.

[server]
bind = "0.0.0.0:7878"
mdns = true                        # advertise soundboard.local

[audio]
output = "default"                 # "default", or an output device name (case-insensitive, a unique part is enough).
                                   # The server logs every available output at startup.
                                   # For Discord/OBS, use a virtual device:
                                   #   SteelSeries Sonar: "Sonar - Microphone", "Sonar - Stream", or "Sonar - Aux"
                                   #   VB-Audio Virtual Cable: "CABLE Input" (set the other app's mic to "CABLE Output")
master_volume = 1.0
max_upload_mb = 20
# sounds_dir = "/home/you/Music/soundboard"   # server-side sound library; default ~/.local/share/soundboard/sounds

[mic]
source = "@DEFAULT_AUDIO_SOURCE@"  # the real mic, not the virtual one

[obs]
host = "127.0.0.1"                 # OBS websocket. Connects when you list or switch scenes.
port = 4455
password = ""                      # leave empty when OBS has no websocket password
