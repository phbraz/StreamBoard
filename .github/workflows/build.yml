name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: soundboard-server
          - os: windows-latest
            bin: soundboard-server.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build server
        run: cargo build --release --locked -p soundboard-server

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          $install = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($install.ExitCode -ne 0) { exit $install.ExitCode }

      - name: Build TheBoard-Setup.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\installer\build.ps1 -InstallerOnly

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: TheBoard-Setup
          path: dist/TheBoard-Setup.exe

      - name: Publish TheBoard-Setup.exe
        if: runner.os == 'Windows' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cargo = Get-Content -Raw server\Cargo.toml
          if ($cargo -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw 'Could not read the version from server\Cargo.toml' }
          $version = $Matches[1]
          $tag = "v$version"
          $setup = 'dist/TheBoard-Setup.exe'
          $notes = "Run TheBoard-Setup.exe. It installs TheBoard for the current user and adds the tray icon plus Start menu, desktop, and Startup shortcuts."
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag --json tagName -q .tagName
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup --clobber
          } else {
            gh release create $tag $setup --title "TheBoard $version" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: soundboard-${{ runner.os }}
          path: target/release/${{ matrix.bin }}
